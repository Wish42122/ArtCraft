<html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | NSBM ArtCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #092b45;
      background: #f7fafb;
    }

    a { text-decoration: none; }

    header {
      position: relative;
      z-index: 2;
      background: #062f48;
      color: #fff;
    }

    .navbar {
      max-width: 1200px;
      min-height: 64px;
      margin: auto;
      padding: 0 5%;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .brand {
      margin-right: auto;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand span {
      margin-left: 12px;
      color: #53e12e;
      font-size: 21px;
    }

    nav,
    .account {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    nav a,
    .account a {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover,
    .login:hover { color: #62e649; }

    .search { display: flex; }

    .register {
      padding: 11px 17px;
      border-radius: 8px;
      background: #43d52f;
    }

    main {
      position: relative;
      min-height: calc(100vh - 64px);
      overflow: hidden;
      background: radial-gradient(ellipse at center, #fff 0%, #f7fafb 65%, #edf6f2 100%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: auto;
      padding: 25px 5% 100px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .breadcrumb a {
      display: flex;
      color: #092b45;
    }

    .content {
      max-width: 500px;
      margin: 45px auto 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: -1px;
      font-weight: 800;
    }

    h1 span { color: #14a730; }

    .description {
      margin: 0 auto;
      max-width: 420px;
      color: #10243b;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 500;
    }

    .card {
      max-width: 400px;
      margin: 38px auto 0;
      padding: 0 25px 25px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 22px rgba(19, 64, 85, 0.08);
    }

    .mail-icon {
      position: relative;
      top: -14px;
      width: 86px;
      height: 86px;
      margin: 0 auto -2px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #0b4e80;
      background: #d9eafb;
    }

    .mail-icon svg {
      width: 44px;
      height: 44px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #496982;
      transform: translateY(-50%);
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 45px;
      border: 1px solid #cbdced;
      border-radius: 7px;
      outline: none;
      color: #092b45;
      background: #fff;
      font: inherit;
      font-size: 14px;
    }

    input::placeholder { color: #425e76; }

    input:focus {
      border-color: #15aa31;
      box-shadow: 0 0 0 3px #dcf6e2;
    }

    .submit {
      width: 100%;
      height: 44px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #10a52e;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:hover { background: #0b8e27; }

    .back {
      display: block;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #dbe6ef;
      color: #0055ff;
      font-size: 14px;
      font-weight: 700;
    }

    .lock-art {
      position: absolute;
      top: 180px;
      left: max(5%, calc((100% - 1100px) / 2));
      width: 120px;
      height: 120px;
      color: #8fc9dc;
      opacity: 0.8;
      transform: rotate(-7deg);
      filter: drop-shadow(0 8px 12px rgba(93, 170, 190, 0.2));
    }

    .wave {
      position: absolute;
      right: -10%;
      bottom: -65px;
      left: -10%;
      height: 105px;
      border-radius: 50% 50% 0 0;
      background: #aad8ce;
      opacity: 0.75;
      transform: rotate(3deg);
    }

    .wave.second {
      bottom: -75px;
      background: #bfe5d8;
      transform: rotate(-4deg);
    }

    .leaves {
      position: absolute;
      width: 180px;
      height: 180px;
      pointer-events: none;
      opacity: 0.8;
    }

    .top-left {
      top: -30px;
      left: -30px;
      transform: rotate(180deg);
    }

    .top-right {
      top: -35px;
      right: -30px;
      transform: rotate(180deg) scaleX(-1);
      opacity: 0.5;
    }

    .bottom-left {
      bottom: -25px;
      left: -20px;
    }

    .bottom-right {
      right: -20px;
      bottom: -25px;
      transform: scaleX(-1);
    }

    @media (max-width: 700px) {
      .navbar {
        flex-wrap: wrap;
        gap: 14px;
        padding-top: 13px;
        padding-bottom: 13px;
      }

      .brand { font-size: 20px; }
      .brand span { font-size: 17px; }

      nav {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 20px;
      }

      .account { gap: 12px; }
      main { min-height: calc(100vh - 105px); }
      .content { margin-top: 38px; }
      .description { font-size: 15px; }
      .lock-art { width: 80px; height: 80px; opacity: 0.3; }
      .leaves { width: 130px; height: 130px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a class="brand" href="/">NSBM <span>ArtCraft</span></a>

      <nav aria-label="Main navigation">
        <a href="homepage.html">Home</a>
        <a href="artgallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="account">
        
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </a>
        <a class="login" href="login.html">Login</a>
        <a class="register" href="register.html">Register</a>
      </div>
    </div>
  </header>

  <main>
    <svg class="leaves top-left" viewBox="0 0 180 180" aria-hidden="true">
      <path d="M0 180C35 126 68 82 120 38" fill="none" stroke="#75b86d" stroke-width="3"/>
      <path d="M37 126C3 116 1 80 8 61c30 8 49 30 44 51Z" fill="#9ed48a"/>
      <path d="M63 94C40 64 48 35 67 19c22 23 27 49 11 70Z" fill="#b1dd9d"/>
      <path d="M78 89c13-31 42-42 69-38-5 27-25 47-57 48Z" fill="#a5d791"/>
      <path d="M19 151c25-29 55-28 78-16-13 24-39 35-68 29Z" fill="#83c978"/>
    </svg>

    <svg class="leaves top-right" viewBox="0 0 180 180" aria-hidden="true">
      <path d="M0 180C35 126 68 82 120 38" fill="none" stroke="#75b86d" stroke-width="3"/>
      <path d="M37 126C3 116 1 80 8 61c30 8 49 30 44 51Z" fill="#9ed48a"/>
      <path d="M63 94C40 64 48 35 67 19c22 23 27 49 11 70Z" fill="#b1dd9d"/>
      <path d="M78 89c13-31 42-42 69-38-5 27-25 47-57 48Z" fill="#a5d791"/>
      <path d="M19 151c25-29 55-28 78-16-13 24-39 35-68 29Z" fill="#83c978"/>
    </svg>

    <svg class="lock-art" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M28 43V29a22 22 0 0 1 44 0v14" stroke="currentColor" stroke-width="9"/>
      <rect x="18" y="39" width="64" height="52" rx="10" fill="currentColor"/>
      <circle cx="50" cy="60" r="8" fill="#f7fafb"/>
      <path d="M47 65h6l4 15H43l4-15Z" fill="#f7fafb"/>
    </svg>

    <div class="container">
      <div class="breadcrumb">
        <a href="homepage.html" aria-label="Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3L12 3Z"></path>
          </svg>
        </a>
        <span>â€º</span>
        <span>Forgot Password</span>
      </div>

      <section class="content">
        <h1>Forgot <span>Password?</span></h1>
        <p class="description">Enter your email address and we'll send you a link to reset your password.</p>

        <div class="card">
          <div class="mail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm8 8L4.5 6h15L12 12Zm-1.3 1.5L4 8.1v8.8l5.2-4.5 1.5 1.1Zm2.6 0 1.5-1.1 5.2 4.5V8.1l-6.7 5.4ZM12 15l-1.2-.9L5 19h14l-5.8-4.9L12 15Z"></path>
            </svg>
          </div>

          <form action="password.html" method="post">
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="1"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
              <input type="email" name="email" aria-label="Email address" placeholder="Enter your email address" required>
            </div>

            <button class="submit" type="submit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M2 12 22 3l-5 18-5-6-4 3v-5l10-7-12 6-4 0Z"></path>
              </svg>
             
            </button>
          </form>

          <a class="back" href="login.html">â† Back to Login</a>
        </div>
      </section>
    </div>

    <div class="wave"></div>
    <div class="wave second"></div>

    <svg class="leaves bottom-left" viewBox="0 0 180 180" aria-hidden="true">
      <path d="M0 180C35 126 68 82 120 38" fill="none" stroke="#5eaa5b" stroke-width="3"/>
      <path d="M37 126C3 116 1 80 8 61c30 8 49 30 44 51Z" fill="#80c974"/>
      <path d="M63 94C40 64 48 35 67 19c22 23 27 49 11 70Z" fill="#a1d989"/>
      <path d="M78 89c13-31 42-42 69-38-5 27-25 47-57 48Z" fill="#83ca72"/>
      <path d="M19 151c25-29 55-28 78-16-13 24-39 35-68 29Z" fill="#68ba60"/>
    </svg>

    <svg class="leaves bottom-right" viewBox="0 0 180 180" aria-hidden="true">
      <path d="M0 180C35 126 68 82 120 38" fill="none" stroke="#5eaa5b" stroke-width="3"/>
      <path d="M37 126C3 116 1 80 8 61c30 8 49 30 44 51Z" fill="#80c974"/>
      <path d="M63 94C40 64 48 35 67 19c22 23 27 49 11 70Z" fill="#a1d989"/>
      <path d="M78 89c13-31 42-42 69-38-5 27-25 47-57 48Z" fill="#83ca72"/>
      <path d="M19 151c25-29 55-28 78-16-13 24-39 35-68 29Z" fill="#68ba60"/>
    </svg>
  </main>
</body>
</html>
